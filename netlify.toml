# ============================================================================
# PRODUCTION hosting config — Netlify TRUE STATIC for Global City Intelligence.
#
# This is the live configuration. Production moved off Vercel to Netlify on
# 2026-08-13 after the Vercel project was deleted; the site is served as a
# prebuilt static artifact.
#
# The published directory is the Next.js `output: 'export'` result (`out/`),
# served as plain files. Deliberately NO @netlify/plugin-nextjs, NO OpenNext,
# NO Functions, NO Edge Functions, NO On-demand Builders: every public page is
# a prebuilt .html file, so there is no server runtime to bill or to fail.
#
# Deploys are MANUAL and artifact-based:
#   npm run build && netlify deploy --dir=out --no-build [--prod]
# There is deliberately no `command` below, so a Git push can never trigger a
# Netlify build. Automatic builds are additionally suppressed by the site-level
# `stop_builds` setting, which lives in the Netlify site config and must NOT be
# expressed here — repo config cannot and should not override it.
# ============================================================================

[build]
  # Prebuilt artifact model (Model B). If Netlify ever builds it itself this
  # becomes `command = "next build"`, but see the report: the 73.5k-page
  # generation is what SIGKILLed a Netlify build before.
  publish = "out"

# ---------------------------------------------------------------------------
# GCI Media (/blog/*) — proxied to a SEPARATE Netlify site.
#
# The editorial product is its own repository and its own Netlify deployment so
# that publishing an article never requires rebuilding or re-uploading this
# 17.8 GB / 169,774-file artifact. Readers and search engines see one domain;
# infrastructure sees two independent deployment units.
#
# status = 200 makes this a REWRITE, not a redirect: the browser URL stays on
# www.globalcityintelligence.com/blog/... The blog origin serves the same
# /blog/... paths, so this is a 1:1 mapping with no path arithmetic.
#
# force = true because the blog owns the entire /blog/* namespace. Netlify's
# default is that an existing static file wins over a rule; this artifact has no
# /blog files today, and forcing keeps it that way deterministically.
#
# REQUIREMENTS (Netlify docs):
#   - the blog site must be in the SAME Netlify team, or the rewrite is refused
#   - the blog site must NOT be password/SSO protected, or it 403s the proxy
#
# Origin verified live 2026-09-01: every /blog path returns 200 with no
# redirect, 0 Functions, 0 Edge Functions. See docs/blog-proxy-integration.md.
# ---------------------------------------------------------------------------
# Two rules, not one. A `/blog/*` splat matches paths BENEATH /blog but does
# not reliably match the bare `/blog`, which is exactly what the header nav
# links to (Next.js strips the trailing slash from "/blog/"). Without the first
# rule the primary nav link would 404 on the canonical domain.
[[redirects]]
  from = "/blog"
  to = "https://globalcityintelligence-blog.netlify.app/blog"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://globalcityintelligence-blog.netlify.app/blog/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# GCI Places (/places/*) — proxied to a SEPARATE Netlify site.
#
# The same architecture as /blog above, for the same reason: Places is its own
# repository, its own corpus and its own deploy unit, so publishing a place
# never requires rebuilding or re-uploading this 22 GB / 169,774-file artifact,
# and this build is never made responsible for generating its ~1,000 routes.
# Readers and search engines see one domain; infrastructure sees three
# independent deployment units.
#
# status = 200 makes this a REWRITE, not a redirect: the browser URL stays on
# www.globalcityintelligence.com/places/... The Places origin serves the same
# /places/... paths, so this is a 1:1 mapping with no path arithmetic, and its
# canonical tags already name this domain rather than the origin.
#
# force = true because Places owns the entire /places/* namespace. Netlify's
# default is that an existing static file wins over a rule; this artifact has
# no /places files today, and forcing keeps it that way deterministically.
#
# Two rules, not one, exactly as for /blog: a `/places/*` splat matches paths
# BENEATH /places but does not reliably match the bare `/places`, which is what
# the primary navigation will link to once PLACES_PUBLIC is enabled.
#
# REQUIREMENTS (verified 2026-09-08 on site 6ec4f94a-c2e0-4211-ba35-d57764a97f61):
#   - same Netlify team as this site, or the rewrite is refused
#   - sso_login MUST be false, or the origin 401s the proxy. New Netlify sites
#     inherit sso_login = true; it was explicitly disabled after creation.
#   - 0 Functions, 0 Edge Functions at the origin
#
# The origin's own robots.txt disallows everything, so it cannot be indexed as
# a duplicate of these canonical URLs. That protection is deliberately NOT an
# X-Robots-Tag header, because response headers propagate through this proxy
# and would noindex the canonical pages too.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/places"
  to = "https://globalcityintelligence-places.netlify.app/places"
  status = 200
  force = true

[[redirects]]
  from = "/places/*"
  to = "https://globalcityintelligence-places.netlify.app/places/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# GCI German edition — /de/* is served by a third deployment.
#
# Site: globalcityintelligence-de (8cc0acc7-6167-491b-8c24-0d4df227ee68)
# 2,758 prebuilt static pages; 0 Functions, 0 Edge Functions, no Git build.
#
# REQUIREMENTS (verified 2026-09-11, and each one has bitten this domain
# before):
#   - same Netlify team as this site, or the rewrite is refused
#   - sso_login MUST be false. A new Netlify site inherits sso_login = true
#     with context "all", which protects PRODUCTION and would 401 this proxy —
#     /de would be entirely dead. Both other proxied origins run sso_login
#     false for exactly this reason.
#   - the origin's own robots.txt disallows everything, and that protection is
#     deliberately NOT an X-Robots-Tag header: response headers propagate
#     through this proxy and would noindex the canonical /de pages.
#   - assets live at /de/_next/... on the origin, not /_next/..., so they
#     cannot collide with this application's own build assets.
#
# TWO RULES, NOT ONE. The bare /de has no splat to match, so without its own
# entry it falls through to this application's 404. The same pair serves
# /blog and /places above.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/de"
  to = "https://globalcityintelligence-de.netlify.app/de"
  status = 200
  force = true

[[redirects]]
  from = "/de/*"
  to = "https://globalcityintelligence-de.netlify.app/de/:splat"
  status = 200
  force = true

# ---------------------------------------------------------------------------
# Redirects — exact translations of the four next.config.ts redirects, which
# `output: 'export'` cannot express. force=false so a real file always wins.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/sitemap/xml"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/sitemap/"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/robots"
  to = "/robots.txt"
  status = 301

# ---------------------------------------------------------------------------
# Retired duplicate city slugs (city identity cleanup).
#
# Each of these was a published record that denoted the same real place as its
# canonical twin — same Wikidata entity, same coordinate — so the URL keeps a
# permanent 301 rather than becoming a 404. The canonical target is a real file,
# so no chain is possible: force is left off and a real file always wins.
# Source of truth for the mapping is lib/data/city-aliases.ts.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/cities/alexandroupolis-gr"
  to = "/cities/alexandroupoli"
  status = 301

[[redirects]]
  from = "/cities/alexandroupolis-gr/*"
